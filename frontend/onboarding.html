<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvoRAG – Personalize Your Experience</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    .onboarding-container {
      max-width: 480px;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 0.65rem 0.8rem;
      margin-top: 0.4rem;
      border: 1px solid #3e3e56;
      border-radius: 6px;
      background: #1e1e2d;
      color: #e0e0f0;
      font-size: 14px;
      box-sizing: border-box;
    }
    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: #6c63ff;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid #3e3e56;
      color: #9a9ab8;
      margin-top: 0.5rem;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.05);
      color: #fff;
    }
    .desc {
      font-size: 13px;
      color: #8c8ca8;
      text-align: center;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-container onboarding-container">
    <h1 class="logo">EvoRAG</h1>
    <h2>Personalize Your Profile</h2>
    <p class="desc">Help EvoRAG tailor research personas and recommendations to your interests.</p>

    <form id="onboarding-form">
      <div class="form-group">
        <label for="role">Your Primary Role</label>
        <select id="role" name="role">
          <option value="AI Researcher">AI / ML Researcher</option>
          <option value="Software Engineer">Software Engineer</option>
          <option value="Policy & Legal Analyst">Policy & Legal Analyst</option>
          <option value="Academic / Student">Academic / Student</option>
          <option value="Product / Business Leader">Product / Business Leader</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="age_range">Age Range</label>
        <select id="age_range" name="age_range">
          <option value="18-24">18 – 24</option>
          <option value="25-34" selected>25 – 34</option>
          <option value="35-49">35 – 49</option>
          <option value="50+">50+</option>
        </select>
      </div>

      <div class="form-group">
        <label for="interests">Primary Interests (comma-separated)</label>
        <input
          type="text"
          id="interests"
          name="interests"
          placeholder="e.g. LLM Alignment, AI Governance, Chips, Multi-agent Systems"
          value="AI Safety, Foundation Models, Multi-agent Systems"
        />
      </div>

      <div class="form-group">
        <label for="response_style">Preferred Synthesis Style</label>
        <select id="response_style" name="response_style">
          <option value="Analytical & Rigorous">Analytical & Rigorous (Deep analysis)</option>
          <option value="Concise & Direct">Concise & Direct (Key findings first)</option>
          <option value="Balanced & Multi-perspective">Balanced & Multi-perspective (Full spectrum)</option>
        </select>
      </div>

      <button type="submit" class="btn primary">Save & Continue to Research</button>
      <button type="button" id="skip-btn" class="btn btn-secondary">Skip to Research Assistant</button>
    </form>

    <div id="onboard-error" class="error-message" style="display:none;"></div>
  </div>

  <script src="/static/auth.js"></script>
  <script>
    const token = EvoRAG.getToken();
    if (!token) {
      window.location.href = '/static/login.html';
    }

    // Prefill if already set
    fetch('/preferences/', {
      headers: { Authorization: `Bearer ${token}` }
    })
    .then(r => r.ok ? r.json() : null)
    .then(pref => {
      if (pref) {
        if (pref.role) document.getElementById('role').value = pref.role;
        if (pref.age_range) document.getElementById('age_range').value = pref.age_range;
        if (pref.interests) document.getElementById('interests').value = pref.interests;
        if (pref.response_style) document.getElementById('response_style').value = pref.response_style;
      }
    })
    .catch(() => {});

    document.getElementById('onboarding-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorDiv = document.getElementById('onboard-error');
      const payload = {
        role: document.getElementById('role').value,
        age_range: document.getElementById('age_range').value,
        interests: document.getElementById('interests').value,
        response_style: document.getElementById('response_style').value,
        onboarding_completed: true,
      };

      try {
        const resp = await fetch('/preferences/', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify(payload),
        });
        if (!resp.ok) {
          const err = await resp.json();
          throw new Error(err.detail || 'Failed to save preferences');
        }
        window.location.href = '/static/index.html';
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.style.display = 'block';
      }
    });

    document.getElementById('skip-btn').addEventListener('click', () => {
      window.location.href = '/static/index.html';
    });
  </script>
</body>
</html>
